<!DOCTYPE html>
<html>
    <head>
        <title>Circles</title>
        <style>
            body {
                background: white;
            }

            .Toolbar{
                float: left;
                font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                font-size: 14px;
                font-variant: small-caps;
                text-align: center;
                background: #F2F7FE;
                padding: 10px 15px 3px 10px;
                margin-bottom: 1px;
                margin-right: 1px;
                border: 1px solid #7B899B
            }
            .Toolbar button {
                padding: 6px;
                margin: 7px 2px;
                font-variant: normal;
                font-size: 12px;
            }

            .CanvasContainer {
                clear: both;
            }
            canvas {
                border: 1px solid #7B899B;
            }

            img {
                padding: 2px;
                border: 2px solid #F2F7FE;
            }

            img:hover {
                border: 2px groove #E4F0FE;
                background: white;
            }


            img.Selected {
                border: 2px groove #E4F0FE;
            }

            #savedCopyContainer {
                display: none;
            }

            #savedCopyContainer img {
                width: 250px;
                height: 150px;
            }

        </style>
    </head>
    <body>
	<div class="CanvasContainer">
	        <canvas id="drawingCanvas" width="500" height="300"></canvas>
	</div>
	<div class="Toolbar">
	        <button onclick="addRandomCircle()">Add Circle</button>
	        <button onclick="clearCanvas()">Clear Canvas</button>
	</div>
    <script src = "script.js"></script>
    </body>
</html>
